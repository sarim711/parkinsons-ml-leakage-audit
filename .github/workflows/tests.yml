name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the interpreter the reported results were produced on.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned runtime deps, so CI exercises the same versions used for the
          # reported results. torch is not installed: neural.py is optional and
          # is not covered by these tests. imbalanced-learn and matplotlib are
          # notebook-only and likewise not needed here.
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Verifies the two invariants the reported numbers depend on:
        # patient-disjoint folds, and train-only fitting of the in-fold
        # transforms. Needs parkinsons_updrs.data, which is committed.
        run: python -m pytest tests/ -v
